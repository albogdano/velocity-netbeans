OpenIDE-Module-Long-Description=\
<b dir="auto">This is an <a href="https://netbeans.apache.org/" rel="nofollow">Apache NetBeans</a> plugin that provides editor support for <a href="https://velocity.apache.org/" rel="nofollow">Apache Velocity Template Language</a> (VTL) files (<code>.vm</code> and <code>.vsl</code> extensions).</b>\
<div class="markdown-heading" dir="auto"><h3 tabindex="-1" class="heading-element" dir="auto">Features</h3><a id="user-content-features" class="anchor" aria-label="Permalink: Features" href="#features"><svg data-component="Octicon" class="octicon octicon-link" viewBox="0 0 16 16" version="1.1" width="16" height="16" aria-hidden="true"><path d="m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z"></path></svg></a></div>\
<ul dir="auto">\
<li><strong>Full syntax highlighting</strong> \u2014 67 token types across 10 categories (keyword, directive, comment, string, operator, number, identifier, boolean, separator, unparsed content)</li>\
<li><strong>Error highlighting</strong> \u2014 real-time syntax error detection with error stripe annotations</li>\
<li><strong>Code folding</strong> \u2014 collapsible regions for <code>#foreach</code>, <code>#if</code>, <code>#elseif</code>, <code>#else</code>, <code>#macro</code> blocks</li>\
<li><strong>Braces matching</strong> \u2014 matches directive pairs (<code>#if</code>/<code>#end</code>, <code>#foreach</code>/<code>#end</code>, <code>#macro</code>/<code>#end</code>)</li>\
<li><strong>HTML embedding</strong> \u2014 full HTML support (highlighting, completion, validation) for HTML content between VTL directives</li>\
<li><strong>Autocompletion</strong> \u2014 context-aware completions for:\
<ul dir="auto">\
<li>Directives (<code>#if</code>, <code>#foreach</code>, <code>#set</code>, <code>#macro</code>, <code>#include</code>, <code>#parse</code>, <code>#define</code>, <code>#evaluate</code>, <code>#stop</code>, <code>#break</code>)</li>\
<li>References (<code>$var</code> variables declared in the template via <code>#set</code>, <code>#foreach</code>, <code>#macro</code>)</li>\
<li>Built-in references (<code>$foreach.count</code>, <code>$foreach.index</code>, <code>$foreach.first</code>, <code>$foreach.last</code>, <code>$foreach.hasNext</code>)</li>\
<li>Keywords (<code>in</code>, <code>and</code>, <code>or</code>, <code>not</code>, <code>eq</code>, <code>ne</code>, <code>lt</code>, <code>le</code>, <code>gt</code>, <code>ge</code>)</li>\
<li>Operators (<code>!</code>, <code>&amp;&amp;</code>, <code>||</code>, <code>==</code>, <code>!=</code>, <code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code>, <code>&gt;=</code>)</li>\
<li>Boolean literals (<code>true</code>, <code>false</code>)</li>\
</ul>\
</li>\
<li><strong>Macro library support</strong> \u2014 reads macro definitions from configurable library files (e.g., <code>VM_global_library.vm</code>) and suggests <code>#macroName()</code> completions</li>\
<li><strong>Java context scanning</strong> \u2014 automatically detects Velocity context variables from Java source code:\
<ul dir="auto">\
<li><code>context.put("key", value)</code> \u2014 Velocity API</li>\
<li><code>model.addAttribute("key", value)</code> \u2014 Spring MVC Model</li>\
</ul>\
</li>\
<li><strong>Method/property completion</strong> \u2014 typing <code>$var.</code> shows available methods and Velocity property shortcuts (e.g., <code>getName()</code> \u2192 <code>name</code>) with full type resolution and multi-level chaining support</li>\
<li><strong>Configurable type mappings</strong> \u2014 define variable types in the options panel for projects where automatic scanning isn't available</li>\
<li><strong>File templates</strong> \u2014 New file templates for Velocity Template (.vsl) and Velocity Macro (.vm)</li>\
</ul>

